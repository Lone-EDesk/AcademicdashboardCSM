<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al-Rowad International Schools | Computer Science LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --top: 30vh;
      --side-margin: 30px;
      --gap: 30px;
      --dd-width: clamp(250px, 19vw, 340px);
      --shift-x: 0px;        /* negative = left, positive = right */

      --navy-deep: #061a45;
      --navy: #0b2e6e;
      --royal: #1565d8;
      --cyan: #22c3f0;
      --white: #ffffff;
      --ice: #eaf6fd;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Barlow", "Segoe UI", Arial, sans-serif;
      background: var(--navy-deep) url("LandingPageImages/bg.png") center bottom / cover no-repeat;
      overflow-x: hidden;
    }

    .content { padding: var(--top) var(--side-margin) 0; }

    /* Same position the 2nd dropdown had (centre of the old 3-item row) */
    .dd-row {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: var(--gap);
      transform: translateX(var(--shift-x));
    }

    .dd { position: relative; width: var(--dd-width); }

    /* ===== Button (same neo style as the old dropdown toggle) ===== */
    .dd-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 18px;
      font-family: "Oswald", sans-serif;
      font-weight: 600;
      font-size: clamp(1rem, 2.4vh, 1.35rem);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--white);
      background: transparent;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 9px 9px 18px #000d24,
                 -9px -9px 18px #023590;
      transition: box-shadow 0.25s;
    }
    .dd-toggle:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
    .dd-toggle:active {
      box-shadow: inset 0 0 14px 3px #023590;
    }

    /* ===== Tablets & phones ===== */
    @media (max-width: 900px) {
      body { background-size: auto 100vh; background-attachment: scroll; }
      .content { padding: 30vh 20px 40vh; }
      :root { --shift-x: 0px; --btn-h: calc(clamp(1rem, 2.4vh, 1.35rem) * 1.5 + 28px); }
      .dd-row { flex-direction: column; align-items: center; gap: 28px; }
      /* keep the button where the 2nd (stacked) dropdown used to be */
      .dd-row { padding-top: calc(var(--btn-h) + 28px); }
      .dd-toggle { height: var(--btn-h); }
      .dd { width: min(100%, 340px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dd-toggle { transition: none; }
    }
  </style>
</head>
<body>

  <main class="content">
    <div class="dd-row">
      <div class="dd">
        <button type="button" class="dd-toggle" id="loadDashboard">Load Dashboard</button>
      </div>
    </div>
  </main>

  <script>
    /* ===== Paste the dashboard URL here ===== */
    const DASHBOARD_URL = "https://firdouslone123.github.io/AddashboardV2/";

    document.getElementById("loadDashboard").addEventListener("click", function () {
      window.location.href = DASHBOARD_URL;   // opens in the same window
    });
  </script>

</body>
</html>
